<h2>Google login jaanch</h2>
<button id="b">1) Google login test</button>
<pre id="o">Button dabayein…</pre>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const o=document.getElementById("o"),log=t=>{o.textContent+="\n"+t};
o.textContent="Page: "+location.host+"\nBrowser: "+navigator.userAgent.slice(0,120);
const app=initializeApp({apiKey:"AIzaSyDwD0TNncMN30T9-XEvLCc8_JUW1qyKfVc",authDomain:"alirazatiktok-5969f.firebaseapp.com",projectId:"alirazatiktok-5969f",storageBucket:"alirazatiktok-5969f.firebasestorage.app",messagingSenderId:"387023414477",appId:"1:387023414477:web:e265f83f68153c456e7584"});
const auth=getAuth(app),db=getFirestore(app);
document.getElementById("b").onclick=async()=>{
 log("\n[Step 1] Google window khul rahi hai…");

 try{const r=await signInWithPopup(auth,new GoogleAuthProvider());u=r.user;log("OK: login hua. Email: "+u.email+"\nUID: "+u.uid)}

 try{await setDoc(doc(db,"users",u.uid),{testAt:serverTimestamp()},{merge:true});log("OK Step 3: Firestore likha. Sab theek hai!")}

};
